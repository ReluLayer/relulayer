[workspace]
members = [
    "10-kernel/relulayer-core",
    "10-kernel/relulayer-security",
    "crates/relulayer-ffi",
    "crates/relulayer-proofs",
    "crates/relulayer-safety",
    "crates/relulayer-fleet",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["ReluLayer Red Team Hardening"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
relulayer-core = { path = "10-kernel/relulayer-core" }
relulayer-security = { path = "10-kernel/relulayer-security" }
relulayer-ffi = { path = "crates/relulayer-ffi" }

[profile.release]
panic = "abort"
lto = true
opt-level = 3
