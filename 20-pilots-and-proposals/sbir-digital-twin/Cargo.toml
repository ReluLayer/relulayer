[workspace]
members = [
    "crates/relulayer-core",
    "crates/relulayer-ffi",
    "crates/relulayer-py",
]
resolver = "2"

[profile.release]
opt-level = "z"          # Optimize for size on flash-constrained targets
lto = true               # Enable link-time optimization for smallest footprint
codegen-units = 1         # Maximize LTO opportunity
panic = "abort"          # Bare-metal targets cannot unwind
strip = true             # Strip debug symbols to reduce artifact size

[profile.dev]
panic = "abort"
