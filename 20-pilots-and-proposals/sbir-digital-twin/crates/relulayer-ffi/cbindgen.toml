language = "C"
header = """
/*
 * ReluLayer C FFI Interface (relulayer.h)
 * Auto-generated by cbindgen for the US Army SBIR ARM26TX04-NV001
 * Embedded Flight Controller Safety Kernel (Pixhawk 6X / STM32H7 / TMS570).
 *
 * This header exposes the bare-metal #![no_std] Rust safety kernel as a C ABI
 * suitable for integration with legacy C/C++ flight software and HIL suites.
 *
 * WARNING: This file is auto-generated. Do not edit manually.
 */"""
include_guard = "RELULAYER_H"
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify. */"
style = "tag"
documentation = true
documentation_style = "c"
line_length = 100
no_includes = true
sys_includes = ["stdint.h", "stdbool.h"]

[export]
include = ["Q16", "Vector3DQ16", "InterceptionResult"]
exclude = []

[export.rename]
"Q16" = "relulayer_q16_t"

[parse]
parse_deps = true
include = ["relulayer-core"]
