name: Build and Deploy Both Sites to AWS Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CORPORATE_WEB_ROOT: /var/www/atelierlogicgroup.com/
  PRODUCT_WEB_ROOT: /var/www/relulayer.ai/

jobs:
  build-and-deploy:
    name: Build, Verify, and Deploy Both Domains
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify corporate site
        run: npm run verify

      - name: Configure SSH credentials
        env:
          LIGHTSAIL_HOST_IP: ${{ secrets.LIGHTSAIL_HOST_IP }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail

          # -----------------------------------------------------------------
          # 1. Preflight: validate required secrets
          # -----------------------------------------------------------------
          : "${LIGHTSAIL_HOST_IP:?Secret LIGHTSAIL_HOST_IP is missing or empty}"
          : "${LIGHTSAIL_SSH_KEY:?Secret LIGHTSAIL_SSH_KEY is missing or empty}"
          LIGHTSAIL_USER="${LIGHTSAIL_USER:-ubuntu}"

          # Persist values for subsequent deployment steps.
          {
            echo "LIGHTSAIL_HOST_IP=${LIGHTSAIL_HOST_IP}"
            echo "LIGHTSAIL_USER=${LIGHTSAIL_USER}"
          } >> "$GITHUB_ENV"

          # -----------------------------------------------------------------
          # 2. Ensure rsync/SSH tooling is available
          # -----------------------------------------------------------------
          missing_tools=""
          for tool in rsync ssh ssh-keyscan; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              missing_tools="$missing_tools $tool"
            fi
          done

          if [ -n "$missing_tools" ]; then
            echo "Missing tools:$missing_tools"
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update >/dev/null
              apt-get install -y openssh-client rsync >/dev/null
            else
              echo "apt-get not available; cannot install missing tools"
              exit 1
            fi
          fi

          # -----------------------------------------------------------------
          # 3. Decode or write SSH private key (handles raw PEM or Base64)
          # -----------------------------------------------------------------
          SSH_DIR="$HOME/.ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          KEY_FILE="$SSH_DIR/lightsail_deploy_key"
          KNOWN_HOSTS="$SSH_DIR/known_hosts"

          if printf '%s\n' "$LIGHTSAIL_SSH_KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            echo "SSH key detected as raw OpenSSH text."
            printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$KEY_FILE"
          else
            echo "SSH key detected as Base64 encoded string."
            printf '%s\n' "$LIGHTSAIL_SSH_KEY" | tr -d ' \n\r' | base64 -d > "$KEY_FILE" 2>/dev/null || printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          # -----------------------------------------------------------------
          # 4. Collect host key (with retry)
          # -----------------------------------------------------------------
          touch "$KNOWN_HOSTS"
          chmod 600 "$KNOWN_HOSTS"

          for attempt in 1 2 3; do
            if ssh-keyscan -H -p 22 -T 10 "$LIGHTSAIL_HOST_IP" >> "$KNOWN_HOSTS" 2>/dev/null; then
              echo "Host key added on attempt $attempt"
              break
            fi
            echo "ssh-keyscan attempt $attempt failed; retrying..."
            sleep 3
          done

          # -----------------------------------------------------------------
          # 5. Persist SSH configuration for subsequent steps
          # -----------------------------------------------------------------
          SSH_OPTS="-i ${KEY_FILE} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=${KNOWN_HOSTS} -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=30"
          {
            echo "SSH_KEY_FILE=${KEY_FILE}"
            echo "SSH_KNOWN_HOSTS=${KNOWN_HOSTS}"
            echo "SSH_OPTS=${SSH_OPTS}"
          } >> "$GITHUB_ENV"

      - name: Ensure web roots exist and set permissions
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST_IP}" \
            "sudo mkdir -p ${{ env.CORPORATE_WEB_ROOT }} ${{ env.PRODUCT_WEB_ROOT }} && \
             sudo chown -R ${LIGHTSAIL_USER}:www-data ${{ env.CORPORATE_WEB_ROOT }} ${{ env.PRODUCT_WEB_ROOT }} && \
             sudo chmod -R 775 ${{ env.CORPORATE_WEB_ROOT }} ${{ env.PRODUCT_WEB_ROOT }}"

      - name: Deploy corporate site to ${{ env.CORPORATE_WEB_ROOT }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh $SSH_OPTS" \
            ./dist/ \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST_IP}:${{ env.CORPORATE_WEB_ROOT }}"

      - name: Deploy product site to ${{ env.PRODUCT_WEB_ROOT }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            -e "ssh $SSH_OPTS" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            ./relulayer-site/ \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST_IP}:${{ env.PRODUCT_WEB_ROOT }}"

      - name: Harden deployment and reload Nginx
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST_IP}" \
            "sudo /home/ubuntu/protect_intellectual_property.sh || true"
          ssh $SSH_OPTS "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST_IP}" \
            "sudo systemctl reload nginx"
          echo "Deployment to ${LIGHTSAIL_HOST_IP} complete."

      - name: Clean up SSH credentials
        if: always()
        run: |
          rm -f "$HOME/.ssh/lightsail_deploy_key"
          rm -f "$HOME/.ssh/known_hosts"
          echo "SSH credentials cleaned up."