[package]
name = "relulayer_kernel"
version = "0.2.0"
edition = "2021"
authors = ["Atelier Logic Group LLC dba ReluLayer™"]
description = "Bare-metal #![no_std] ReluLayer™ safety interdiction micro-kernel for ARM Cortex-M7 / STM32H7."
license = "Proprietary"
repository = "https://github.com/atelierlogicgroup/relulayer"

[lib]
# staticlib  -> linked into PX4/ArduPilot embedded builds.
# rlib       -> consumed by other Rust crates.
# cdylib     -> host .so/.dll for Python ctypes / ROS 2 bridge development.
crate-type = ["staticlib", "rlib", "cdylib"]

[features]
# Default host builds enable std so that `cargo test` runs without flags.
# Embedded builds use `cargo build --no-default-features --target thumbv7em-none-eabihf`
# to enforce the required `#![no_std]` envelope.
default = ["std"]
std = []

[dependencies]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
panic = "abort"
