[package]
name = "relulayer"
version = "0.1.0"
edition = "2021"
description = "Deterministic sub-microsecond physical AI safety governor"
license = "Apache-2.0 OR MIT"

[lib]
name = "relulayer"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
relulayer-core = { path = "../../10-kernel/relulayer-core" }

[features]
default = []
