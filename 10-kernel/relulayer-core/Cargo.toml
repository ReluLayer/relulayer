[package]
name = "relulayer-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["std"]
# Enable standard-library support. Disable for `#![no_std]` production builds.
std = []
# Embedded target support (mutually exclusive with `std`).
embedded = ["cortex-m", "cortex-m-rt"]

[dependencies]
cortex-m = { version = "0.7", default-features = false, optional = true }
cortex-m-rt = { version = "0.7", optional = true }

[build-dependencies]
cbindgen = { version = "0.28", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
